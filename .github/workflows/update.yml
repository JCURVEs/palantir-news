name: Update Palantir News

on:
  schedule:
    # 04:30-09:30 KST, six batches per day
    - cron: '30 0,19-23 * * *'
  workflow_dispatch:
    inputs:
      analysis_limit:
        description: 'Maximum pending articles to analyze (1-5)'
        required: false
        default: '5'

concurrency:
  group: palantir-news-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -e .
      - name: Collect and analyze
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL || 'qwen/qwen3.8-27b' }}
          ANALYSIS_LIMIT: ${{ inputs.analysis_limit || '5' }}
        run: |
          if ! [[ "$ANALYSIS_LIMIT" =~ ^[1-5]$ ]]; then
            echo "analysis_limit must be between 1 and 5" >&2
            exit 1
          fi
          palantir-news --start-year 2020 --end-year 2026 --analysis-limit "$ANALYSIS_LIMIT" --analysis-pause-seconds 60
      - name: Commit updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data CATALOG.md
          if [ -d archive ]; then git add archive; fi
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "docs: update Palantir news archive"
            git push
          fi
