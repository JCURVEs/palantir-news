name: Update Palantir News

on:
  push:
    branches: [main]
    paths:
      - 'src/palantir_news/**'
      - 'data/editorials/**'
      - '.github/workflows/update.yml'
  schedule:
    # Historical newsletter batches, 04:30-09:30 KST
    - cron: '30 0,19-23 * * *'
    # Fresh-post radar every three hours, at :15 UTC
    - cron: '15 */3 * * *'
  workflow_dispatch:
    inputs:
      analysis_limit:
        description: 'Maximum pending articles to analyze (1-5)'
        required: false
        default: '5'
      article_id:
        description: 'Optional Medium article ID to refresh one newsletter'
        required: false

concurrency:
  group: palantir-news-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -e .
      - name: Collect and analyze
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL || 'qwen/qwen3.8-27b' }}
          ANALYSIS_LIMIT: ${{ github.event_name == 'push' && '1' || inputs.analysis_limit || '5' }}
          ARTICLE_ID: ${{ inputs.article_id || '' }}
          RADAR_RUN: ${{ github.event.schedule == '15 */3 * * *' }}
        run: |
          if ! [[ "$ANALYSIS_LIMIT" =~ ^[1-5]$ ]]; then
            echo "analysis_limit must be between 1 and 5" >&2
            exit 1
          fi
          if [ "$RADAR_RUN" = "true" ]; then
            args=(--start-year 2020 --end-year 2026 --analysis-limit 1 --recent-only)
          else
            args=(--start-year 2020 --end-year 2026 --analysis-limit "$ANALYSIS_LIMIT" --analysis-pause-seconds 60 --media-limit 20 --linked-media-limit 3)
          fi
          if [ -n "$ARTICLE_ID" ]; then
            if ! [[ "$ARTICLE_ID" =~ ^[0-9a-f]{12}$ ]]; then
              echo "article_id must be a 12-character Medium ID" >&2
              exit 1
            fi
            args+=(--article-id "$ARTICLE_ID")
          fi
          palantir-news "${args[@]}"
      - name: Commit updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data CATALOG.md
          if [ -d archive ]; then git add archive; fi
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "docs: update Palantir news archive"
            git push
          fi
