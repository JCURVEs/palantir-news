<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 650" role="img" aria-labelledby="title desc">
  <title id="title">CNC E214 과열 진단 가상 사례</title>
  <desc id="desc">입력 계측값, 필터 교체 추천, 성공 조건, 후속 결과를 차례로 보여주는 한국어 도해</desc>
  <rect width="560" height="650" fill="#f4f5f2"/>
  <text x="35" y="43" fill="#087d78" font-family="Noto Sans KR,sans-serif" font-size="14" font-weight="700">한국어 도해 02 / 가상 CNC 사례</text>
  <text x="35" y="77" fill="#152326" font-family="Noto Sans KR,sans-serif" font-size="24" font-weight="700">E214 경보를 학습 사례로 바꾸기</text>
  <g font-family="Noto Sans KR,sans-serif">
    <rect x="35" y="104" width="490" height="107" fill="#fff" stroke="#b7c6c1" stroke-width="2"/>
    <text x="57" y="137" fill="#087d78" font-size="16" font-weight="700">01  입력 · 고장 맥락</text>
    <text x="57" y="168" fill="#152326" font-size="22" font-weight="700">경보 E214</text>
    <text x="57" y="193" fill="#425554" font-size="16">냉각수 5.1 L/min · 온도 89°C</text>
    <path d="M280 212v20m-7-8 7 8 7-8" fill="none" stroke="#087d78" stroke-width="3"/>
    <rect x="35" y="235" width="490" height="92" fill="#e9efec" stroke="#a8bdb7" stroke-width="2"/>
    <text x="57" y="268" fill="#087d78" font-size="16" font-weight="700">02  모델의 제안</text>
    <text x="57" y="301" fill="#152326" font-size="22" font-weight="700">냉각수 필터 교체</text>
    <path d="M280 328v20m-7-8 7 8 7-8" fill="none" stroke="#087d78" stroke-width="3"/>
    <rect x="35" y="351" width="490" height="128" fill="#fff" stroke="#b7c6c1" stroke-width="2"/>
    <text x="57" y="384" fill="#087d78" font-size="16" font-weight="700">03  성공 판정 · 모두 충족해야 함</text>
    <text x="57" y="415" fill="#152326" font-size="18">유량 &gt; 8 L/min</text>
    <text x="57" y="442" fill="#152326" font-size="18">온도 &lt; 75°C를 30분간 유지</text>
    <text x="57" y="469" fill="#152326" font-size="18">E214 재발 없음</text>
    <path d="M280 480v20m-7-8 7 8 7-8" fill="none" stroke="#087d78" stroke-width="3"/>
    <rect x="35" y="503" width="490" height="109" fill="#102a31"/>
    <text x="57" y="536" fill="#bfe2dd" font-size="16" font-weight="700">04  운영 결과를 다음 사례로</text>
    <text x="57" y="568" fill="#fff" font-size="20" font-weight="700">수락 · 수정 · 실패</text>
    <text x="57" y="594" fill="#d8ebe7" font-size="15">추천과 실제 조치, 사후 계측값을 함께 기록</text>
  </g>
</svg>
